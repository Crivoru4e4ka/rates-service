services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rates
      POSTGRES_PASSWORD: rates
      POSTGRES_DB: rates
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rates -d rates"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://rates:rates@postgres:5432/rates?sslmode=disable
      RATES_PROVIDER: ${RATES_PROVIDER:-frankfurter}
      RATES_API_URL: ${RATES_API_URL:-}
      RATES_API_KEY: ${RATES_API_KEY:-}
      PROVIDER_MAX_ATTEMPTS: ${PROVIDER_MAX_ATTEMPTS:-3}
      PROVIDER_RETRY_BASE_DELAY: ${PROVIDER_RETRY_BASE_DELAY:-500ms}
      PROVIDER_RETRY_MAX_DELAY: ${PROVIDER_RETRY_MAX_DELAY:-10s}
      PROVIDER_MIN_INTERVAL: ${PROVIDER_MIN_INTERVAL:-1s}
      PROVIDER_CACHE_TTL: ${PROVIDER_CACHE_TTL:-60s}
      SUPPORTED_CURRENCIES: ${SUPPORTED_CURRENCIES:-USD,EUR,MXN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
